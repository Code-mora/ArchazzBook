<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader - ArchazzBook</title>
    
    <!-- Open Graph Meta Tags for Link Previews -->
    <meta property="og:title" content="Read on ArchazzBook">
    <meta property="og:description" content="Discover and read captivating digital stories on ArchazzBook.">
    <meta property="og:image" content="https://raw.githubusercontent.com/Code-mora/ArchazzBook/main/assets/about-illustration.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .reader-container {
            min-height: 100vh;
            background: var(--gray-lighter);
            padding-top: 80px;
        }
        
        .reader-header {
            background: white;
            padding: 1rem 2rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
        }
        
        .reader-header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .book-info-header {
            text-align: center;
        }
        
        .book-info-header h1 {
            font-size: 1.5rem;
            font-family: var(--font-display);
            margin-bottom: 0.25rem;
        }
        
        .book-info-header p {
            color: var(--gray);
            font-size: 0.875rem;
        }
        
        .reader-controls {
            display: flex;
            gap: 1rem;
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .reader-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }
        
        /* A4 Paper Size - 210mm x 297mm ratio (1:1.414) */
        .reader-paper {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            padding: 3rem 2.5rem;
            /* A4 aspect ratio with max-width */
            max-width: 21cm;
            min-height: 29.7cm;
            margin: 0 auto;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--dark-light);
            position: relative;
        }
        
        .reader-paper h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: inherit;
        }
        
        .reader-paper p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }
        
        /* Page Info Badge */
        .page-info {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            font-family: var(--font-primary);
            opacity: 0.75;
        }
        
        /* Pagination Controls */
        .reader-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .pagination-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-fast);
            font-weight: 600;
        }
        
        .pagination-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .pagination-info {
            font-weight: 600;
            color: var(--dark);
            padding: 0.75rem 1rem;
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }
        
        .reader-navigation {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .reader-settings {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .settings-btn {
            width: 48px;
            height: 48px;
            border: none;
            background: var(--gray-lighter);
            color: var(--dark);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: var(--transition-fast);
        }
        
        .settings-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        .settings-btn.active {
            background: var(--primary);
            color: white;
        }
        

        
        
        @media (max-width: 768px) {
            .reader-content {
                padding: 0 1.25rem 3rem;
            }
            
            .reader-paper {
                padding: 2rem 1.5rem;
                min-height: auto;
                font-size: 1rem;
            }
            
            .reader-paper h2 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }
            
            .reader-settings {
                position: static;
                transform: none;
                flex-direction: row;
                margin: 0 1.25rem 1.5rem;
                justify-content: center;
            }
            
            .settings-btn {
                width: 44px;
                height: 44px;
                font-size: 1.125rem;
            }
            
            .reader-header {
                padding: 1rem 1.25rem;
            }
            
            .reader-header-content {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
                text-align: center;
            }
            
            .reader-controls {
                width: 100%;
                justify-content: center;
                position: static;
                transform: none;
            }
            
            .pagination-btn {
                padding: 0.625rem 1rem;
                font-size: 0.875rem;
            }
            
            .reader-pagination {
                gap: 1rem;
            }
            
            .pagination-info {
                padding: 0.625rem 0.875rem;
                font-size: 0.875rem;
            }
        }
        
        @media (max-width: 480px) {
            .reader-content {
                padding: 0 1rem 2rem;
            }
            
            .reader-paper {
                padding: 1.5rem 1rem;
                font-size: 0.9375rem;
                line-height: 1.7;
            }
            
            .reader-paper h2 {
                font-size: 1.25rem;
                margin-bottom: 1.25rem;
            }
            
            .page-info {
                font-size: 0.6875rem;
                padding: 0.375rem 0.75rem;
            }
            
            .reader-header {
                padding: 0.875rem 1rem;
            }
            
            .book-info-header h1 {
                font-size: 1.125rem;
            }
            
            .book-info-header p {
                font-size: 0.8125rem;
            }
            
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }
            
            .settings-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .reader-settings {
                margin: 0 1rem 1.25rem;
                gap: 0.75rem;
            }
            
            .pagination-btn {
                padding: 0.5rem 0.875rem;
                font-size: 0.8125rem;
            }
            
            .pagination-info {
                padding: 0.5rem 0.75rem;
                font-size: 0.8125rem;
            }
            
            .reader-pagination {
                gap: 0.75rem;
                margin-top: 1.5rem;
            }
        }
        
        /* Comments Section Styles */
        .comments-container {
            max-width: 800px;
            margin: 3rem auto 0;
            background: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .comments-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--gray-lighter);
            padding-bottom: 1rem;
        }

        .comments-header h3 {
            font-size: 1.25rem;
            color: var(--dark);
            margin: 0;
        }

        .badge {
            background: var(--gray-lighter);
            color: var(--gray);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .comment {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: var(--gray-lighter);
            border-radius: var(--radius-md);
            transition: var(--transition-fast);
        }

        .comment:hover {
            box-shadow: var(--shadow-sm);
        }

        .comment.author {
            background: #EEF2FF; /* Light Indigo */
            border: 1px solid #C7D2FE;
        }
        
        .comment.author .comment-author-name {
            color: var(--primary);
        }
        
        .comment.author .comment-author-name::after {
            content: 'Author';
            background: var(--primary);
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .comment.reply {
            margin-left: 2rem;
            position: relative;
            background: rgba(0, 0, 0, 0.02); /* Very subtle background */
            border-left: 2px solid var(--gray-light);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 0.75rem;
            gap: 0.75rem;
        }

        .comment.reply .comment-avatar {
            width: 32px;
            height: 32px;
            font-size: 0.8rem;
        }
        
        .comment.reply .comment-body {
            font-size: 0.95em;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .comment.reply {
                margin-left: 1rem; /* Less indentation on mobile */
                padding: 0.75rem;
            }
            
            .comments-container {
                padding: 1.25rem;
            }
            
            .comment {
                padding: 0.75rem;
            }
            
            .comment-header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
                margin-bottom: 0.25rem;
            }
            
            .comment-time {
                font-size: 0.7rem;
            }
        }
        
        /* RESTORED AVATAR STYLE */
        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            flex-shrink: 0;
        }

        .comment.author .comment-avatar {
            background: var(--gradient-primary);
        }

        .comment-body {
            flex: 1;
        }

        .comment-header-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .comment-author-name {
            font-weight: 600;
            color: var(--dark);
            font-size: 0.9rem;
        }

        .comment-time {
            font-size: 0.75rem;
            color: var(--gray);
        }

        .comment-text {
            color: var(--dark-light);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .comment-actions {
            margin-top: 0.5rem;
            display: flex;
            gap: 1rem;
        }

        .reply-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .reply-btn:hover {
            text-decoration: underline;
        }
        
        .action-btn {
            background: none;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.2s;
        }
        
        .edit-btn {
           color: var(--accent);
        }
        
        .edit-btn:hover {
            color: #d97706; /* darker amber */
        }

        .delete-btn {
            color: #ef4444; /* red-500 */
        }
        
        .delete-btn:hover {
            color: #b91c1c; /* red-700 */
        }

        .comment-form {
            background: var(--gray-lighter);
            padding: 1.5rem;
            border-radius: var(--radius-md);
        }

        .comment-form h4 {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .comment-form textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-light);
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-family: inherit;
            resize: vertical;
        }
        
        /* Emoji Reaction Bar */
        .reaction-bar {
            max-width: 800px;
            margin: 1.5rem auto 0;
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .reaction-bar-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray);
            white-space: nowrap;
        }
        .reaction-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.9rem;
            border-radius: 2rem;
            border: 2px solid var(--gray-lighter);
            background: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            font-family: inherit;
        }
        .reaction-btn .reaction-count {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--gray);
        }
        .reaction-btn:hover {
            border-color: var(--primary);
            background: #EEF2FF;
            transform: scale(1.05);
        }
        .reaction-btn.active {
            border-color: var(--primary);
            background: #EEF2FF;
        }
        .reaction-btn.active .reaction-count {
            color: var(--primary);
        }
        @media (max-width: 480px) {
            .reaction-bar {
                padding: 1rem;
                gap: 0.75rem;
            }
        }
        
        .loading-spinner {
            text-align: center;
            color: var(--gray);
            padding: 2rem;
        }
        /* ====== Quill Editor Output Compatibility ======
         * Quill memakai class-class khusus untuk format teks.
         * Kita butuh style ini supaya konten chapter tampil sesuai
         * seperti saat ditulis di editor (align, dsb).
         */
        .reader-paper .ql-align-center,
        #story-content .ql-align-center {
            text-align: center !important;
        }
        .reader-paper .ql-align-right,
        #story-content .ql-align-right {
            text-align: right !important;
        }
        .reader-paper .ql-align-justify,
        #story-content .ql-align-justify {
            text-align: justify !important;
        }
        /* Fix untuk elemen yang tidak punya class tapi di-set via inline style */
        #story-content p[style*="text-align: center"],
        #story-content div[style*="text-align: center"] {
            text-align: center !important;
        }
        /* Style untuk horizontal rule / divider separator (======) */
        #story-content p:has(> br:only-child),
        #story-content p:empty {
            display: none; /* Sembunyikan paragraf kosong */
        }
        #story-content .ql-align-center:not(:empty) {
            letter-spacing: 0.5em;
            color: var(--gray);
            margin: 2rem 0;
        }
        /* Sembunyikan outline border dari Quill block yang ter-render di reader */
        #story-content [class*="ql-"] {
            outline: none !important;
            border: none !important;
        }
    
    </style>
</head>

                </a>

    <!-- Reader -->
    <div class="reader-container">
        <!-- Header -->

        <!-- Reading Settings -->

            <button class="settings-btn active" onclick="resetFontSize()" title="Reset font size">

            <!-- Emoji Reaction Bar -->
            <div class="reaction-bar" id="reaction-bar">

                        <textarea id="comment-input" placeholder="Share your thoughts about this story..." rows="3"></textarea>

                    <button class="btn btn-primary" onclick="postComment()">
                        <i class="fas fa-paper-plane"></i> Post Comment
                    </button>

            <div class="reader-navigation">
                <button class="btn btn-large btn-outline" onclick="window.history.back()">

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Configuration -->
    <script src="supabase-config.js"></script>
    
    <!-- App Logic -->
    <script src="app.js"></script>
    <script>
        let currentFontSize = 1.125; // rem
        let isDarkMode = false;
        let currentChapterId = null;
        let currentPageInChapter = 1;
        let currentBook = null;

        // Parses a localStorage entry, discarding it if it is corrupted
        function readStoredJSON(key, fallback) {
            const raw = localStorage.getItem(key);
            if (raw === null) return fallback;
            try {
                const parsed = JSON.parse(raw);
                return parsed === null ? fallback : parsed;
            } catch (e) {
                console.error(`❌ Corrupted "${key}" in localStorage, clearing:`, e);
                localStorage.removeItem(key);
                return fallback;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Get current user for auth checks
            // A corrupt entry must not abort the whole reader initialisation
            window.currentUser = readStoredJSON('currentUser', null);
            loadBook().catch(e => {
                console.error('❌ Failed to load book:', e);
                alert('Could not open this book. Please check your connection and try again.');
            });
        });

        // --- Comments Logic ---
        
        async function loadComments() {
            if (!currentBook || !window.SupabaseAPI) return;
            // ... (rest of function is fine)

            
            const commentsList = document.getElementById('comments-list');
            const commentsCount = document.getElementById('comments-count');
            
            try {
                // Pass currentChapterId so it fetches per-chapter comments (Webtoon style)
                const comments = await window.SupabaseAPI.fetchComments(currentBook.id, currentChapterId);
                
                commentsCount.textContent = comments.length;
                
                if (comments.length === 0) {
                    commentsList.innerHTML = `
                        <div style="text-align: center; color: var(--gray); padding: 2rem;">
                            <i class="far fa-comment-dots" style="font-size: 2rem; margin-bottom: 0.5rem;"></i>
                            <p>No comments yet. Be the first to share your thoughts!</p>
                        </div>
                    `;
                    return;
                }
                
                commentsList.innerHTML = ''; // Clear loading/empty message
                
                // Process comments to handle threading (simplistic 1-level for now or flat list ordered by time)
                // Since our query fetches all ordered by time, we just render them.
                // If we want nested replies, we'd need to organize them. 
                // For simplicity, let's render strictly chronologically but indent replies if parent_id exists
                
                // First pass: Map ID to comment for lookup
                const commentMap = {};
                comments.forEach(c => commentMap[c.id] = c);
                
                // Separate roots and replies
                const rootComments = comments.filter(c => !c.parent_id);
                const replies = comments.filter(c => c.parent_id);
                
                // Helper to render
                const renderComment = (comment, isReply = false) => {
                    const div = document.createElement('div');
                    div.className = `comment ${comment.is_author ? 'author' : ''} ${isReply ? 'reply' : ''}`;
                    div.id = `comment-${comment.id}`;
                    
                    const initials = comment.author_name.substring(0, 2).toUpperCase();
                    const timeAgo = formatTimeAgo(new Date(comment.created_at));
                    
                    // Check logic for permissions
                    const currentUser = readStoredJSON('currentUser', null);
                    const isAuthorUser = currentUser && currentUser.role === 'author';
                    
                    // Check if this comment belongs to the anonymous user
                    const myComments = readStoredJSON('my_comments', []);
                    const isMyComment = myComments.includes(comment.id);
                    
                    // Rules:
                    // 1. Edit: Only the creator can edit (User can edit theirs, Author can edit theirs)
                    // 2. Delete: Creator can delete, AND Author can delete anyone's (moderation)
                    
                    const isCommentCreator = isMyComment || (isAuthorUser && comment.is_author);
                    
                    const canEdit = isCommentCreator;
                    const canDelete = isCommentCreator || isAuthorUser;
                    
                    let actionsHtml = '';
                    
                    // Always allow reply
                    actionsHtml += `
                        <button class="action-btn reply-btn" onclick="startReply(${comment.id}, '${comment.author_name}')">
                            <i class="fas fa-reply"></i> Reply
                        </button>
                    `;
                    
                    if (canEdit) {
                        actionsHtml += `
                            <button class="action-btn edit-btn" onclick="startEdit(${comment.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        `;
                    }
                    
                    if (canDelete) {
                         actionsHtml += `
                            <button class="action-btn delete-btn" onclick="deleteCommentNode(${comment.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        `;
                    }

                    div.innerHTML = `
                        <div class="comment-avatar">${initials}</div>
                        <div class="comment-body">
                            <div class="comment-header-row">
                                <span class="comment-author-name">${comment.author_name}</span>
                                <span class="comment-time">${timeAgo}</span>
                            </div>
                            <div class="comment-content-wrapper" id="content-${comment.id}">
                                <div class="comment-text">${escapeHtml(comment.content)}</div>
                                <div class="comment-actions">
                                    ${actionsHtml}
                                </div>
                            </div>
                            <div class="edit-form" id="edit-form-${comment.id}" style="display: none; margin-top: 0.5rem;">
                                <textarea class="edit-input" rows="2" style="width: 100%; border: 1px solid var(--gray-light); border-radius: var(--radius-sm); padding: 0.5rem;"></textarea>
                                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                                    <button class="btn btn-sm btn-primary" onclick="saveEdit(${comment.id})">Save</button>
                                    <button class="btn btn-sm btn-outline" onclick="cancelEdit(${comment.id})">Cancel</button>
                                </div>
                            </div>
                        </div>
                    `;
                    // Store content for edit
                    div.dataset.content = comment.content;
                    return div;
                };

                // Render roots then their replies
                rootComments.forEach(root => {
                    commentsList.appendChild(renderComment(root));
                    
                    // Find direct replies
                    const myReplies = replies.filter(r => r.parent_id === root.id);
                    myReplies.forEach(reply => {
                       commentsList.appendChild(renderComment(reply, true)); 
                    });
                });
                
            } catch (error) {
                console.error('Error loading comments:', error);
                commentsList.innerHTML = '<p class="text-center">Failed to load comments.</p>';
            }
        }

        let replyToId = null;
        
        function startReply(commentId, authorName) {

            textarea.placeholder = `Replying to ${authorName}...`;

        async function postComment() {
            const input = document.getElementById('comment-input');
            const content = input.value.trim();
            
            if (!content) {
                alert('Please enter a comment.');
                return;
            }
            
            // Identity logic
            const currentUser = readStoredJSON('currentUser', null);
            const isAuthor = currentUser && currentUser.role === 'author';
            
            // Random name for anon, or 'Archazz' for author
            let authorName = 'Anonymous';
            if (isAuthor) {
                authorName = 'Archazz'; // Or currentUser.name
            } else {
                let savedAnonName = localStorage.getItem('archazz_anon_name');
                if (!savedAnonName) {
                    const adjectives = ['Happy', 'Curious', 'Quiet', 'Loud', 'Mystery', 'Brave', 'Charming', 'Sleepy'];
                    const animals = ['Reader', 'Bookworm', 'Cat', 'Owl', 'Fox', 'Panda', 'Tiger', 'Wolf'];
                    const randAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
                    const randAni = animals[Math.floor(Math.random() * animals.length)];
                    const randNum = Math.floor(Math.random() * 900) + 100; // 100-999
                    savedAnonName = `${randAdj} ${randAni} ${randNum}`;
                    localStorage.setItem('archazz_anon_name', savedAnonName);
                }
                authorName = savedAnonName;
            }

            try {
                // Show temporary state
                const btn = document.querySelector('.comment-form button');
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting...';
                
                const browserId = localStorage.getItem('archazz_browser_id');
                const commentData = {
                    book_id: currentBook.id,
                    chapter_id: currentChapterId, // Store specific chapter to make it per-chapter
                    content: content,
                    author_name: authorName,
                    is_author: isAuthor,
                    parent_id: replyToId,
                    browser_id: browserId
                };
                
                let result;
                try {
                    result = await window.SupabaseAPI.createComment(commentData);
                } catch (dbErr) {
                    // Fallback: If browser_id is not in fcm_tokens, retry without it
                    if (dbErr.message && dbErr.message.includes('foreign key constraint')) {
                        console.warn('Browser ID not found in fcm_tokens, retrying without browser_id...');
                        commentData.browser_id = null;
                        result = await window.SupabaseAPI.createComment(commentData);
                    } else {
                        throw dbErr;
                    }
                }
                
                // Save to my_comments in localStorage so I can edit/delete it later
                const myComments = readStoredJSON('my_comments', []);
                myComments.push(result.id);
                localStorage.setItem('my_comments', JSON.stringify(myComments));
                
                // Reset form
                input.value = '';
                replyToId = null;
                input.placeholder = "Share your thoughts about this story...";
                btn.disabled = false;
                btn.innerHTML = originalText;
                
                showNotification('Comment posted!');
                loadComments(); // Refresh list
                
            } catch (error) {
                console.error('Error posting comment:', error);
                alert('Failed to post comment: ' + (error.message || JSON.stringify(error)));
                
                // Reset button
                const btn = document.querySelector('.comment-form button');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Post Comment';
            }
        }

        function formatTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m ago";
            return "Just now";
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // --- Emoji Reactions Logic ---
        const emojis = ['😊', '😍', '🔥', '😢', '😂'];

        async function loadReactions() {
            if (!currentBook || !window.SupabaseAPI || !window.SupabaseAPI.fetchReactions) return;
            
            const btnContainer = document.getElementById('reaction-buttons');
            try {
                const reactions = await window.SupabaseAPI.fetchReactions(currentBook.id, currentChapterId || null);
                let browserId = localStorage.getItem('archazz_browser_id');
                // Polyfill if someone didn't click anywhere before reaching here
                if (!browserId) {
                    browserId = 'anon-' + Date.now() + Math.random().toString(36).substring(2);
                    localStorage.setItem('archazz_browser_id', browserId);
                }
                
                // Count occurrences for each emoji
                const counts = {};
                emojis.forEach(e => counts[e] = 0);
                
                let myReaction = null;
                
                reactions.forEach(r => {
                    if (counts[r.emoji] !== undefined) counts[r.emoji]++;
                    if (r.browser_id === browserId) myReaction = r.emoji;
                });
                
                let html = '';
                emojis.forEach(emoji => {
                    const count = counts[emoji];
                    const isActive = myReaction === emoji ? 'active' : '';
                    html += `
                        <button class="reaction-btn ${isActive}" onclick="toggleReaction('${emoji}', '${myReaction || ''}')">
                            ${emoji} <span class="reaction-count">${count > 0 ? count : ''}</span>
                        </button>
                    `;
                });
                
                btnContainer.innerHTML = html;
            } catch (error) {
                console.error('Failed to load reactions', error);
                btnContainer.innerHTML = '<span style="color:var(--gray); font-size:0.85rem">Error loading reactions</span>';
            }
        }

        window.toggleReaction = async function(emoji, currentReaction) {
            let browserId = localStorage.getItem('archazz_browser_id');
            if (!browserId) return;

            // Optimistic UI update
            const btnContainer = document.getElementById('reaction-buttons');
            btnContainer.style.opacity = '0.5';
            btnContainer.style.pointerEvents = 'none';

            try {
                if (currentReaction === emoji) {
                    // Turn it off
                    await window.SupabaseAPI.deleteReaction(currentBook.id, currentChapterId || null, browserId);
                } else {
                    // Turn it on (upsert replaces if already voted)
                    await window.SupabaseAPI.addReaction(currentBook.id, currentChapterId || null, browserId, emoji);
                }
            } catch (e) {
                console.error("Gagal bereaksi:", e);
                showNotification('Failed to save reaction');
            }

            btnContainer.style.opacity = '1';
            btnContainer.style.pointerEvents = 'auto';
            loadReactions();
        }

        async function loadBook() {
            // Get book ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = parseInt(urlParams.get('id'));

            if (!bookId) {
                alert('Book not found');
                window.location.href = 'index.html';
                return;
            }

            let books = [];
            let fetchFailed = false;

            // Try Supabase first to get fresh data (critical for draft -> published sync)
            if (window.SupabaseAPI) {
                try {
                    books = await window.SupabaseAPI.fetchBooks();

                    // Optional: update local cache with fresh data
                    try {
                        localStorage.setItem('books', JSON.stringify(books));
                    } catch (e) {
                        console.warn('⚠️ Could not update local books cache:', e);
                    }
                } catch (e) {
                    console.error('Failed to fetch from Supabase in reader, falling back to local', e);
                    fetchFailed = true;
                    books = readStoredJSON('books', []);
                }
            } else {
                // Fallback if no Supabase
                books = readStoredJSON('books', []);
                if (books.length === 0 && window.ArchazzBook && window.ArchazzBook.books) {
                    books = window.ArchazzBook.books;
                }
            }

            let book = books.find(b => b.id === bookId);

            if (!book) {
                // Distinguish "this book doesn't exist" from "we couldn't load anything"
                alert(fetchFailed
                    ? 'Could not load this book. Please check your connection and try again.'
                    : 'Book not found');
                window.location.href = 'index.html';
                return;
            }

            currentBook = book;

            // Display book info
            // Handle both legacy (localStorage) and Supabase field names
            const authorName = book.author || book.author_name || 'Malatie';
            document.getElementById('reader-book-title').textContent = book.title;
            document.getElementById('reader-book-author').textContent = authorName;
            document.title = `${book.title} - ArchazzBook`;

            // Check if book has chapter-based structure
            if (book.chapters && book.chapters.length > 0) {
                // New chapter-based format
                loadChapterBasedBook();
            } else {
                // Old single-story format - convert for backwards compatibility
                loadLegacyBook();
            }
            
            // Now that book is loaded, fetch comments
            loadComments();
            loadReactions();
        }

        function loadChapterBasedBook() {
            // Check for explicit preview mode in URL
            const urlParams = new URLSearchParams(window.location.search);
            const isPreviewMode = urlParams.get('preview') === 'true';

            // Filter chapters if not author AND not in preview mode
            if (!isPreviewMode && (!currentUser || currentUser.role !== 'author')) {
                // If user is not author, only show published chapters
                // Handle legacy chapters (no status) as published
                currentBook.chapters = currentBook.chapters.filter(c => !c.status || c.status === 'published');
            }
            
            if (currentBook.chapters.length === 0) {
                document.getElementById('story-content').innerHTML = `
                    <div style="text-align: center; padding: 3rem;">
                        <i class="fas fa-book-open" style="font-size: 3rem; color: var(--gray); margin-bottom: 1rem;"></i>
                        <h3>No published chapters yet</h3>
                        <p>The author hasn't published any chapters for this book yet. Check back later!</p>
                    </div>
                `;
                document.getElementById('page-info').style.display = 'none';
                return;
            }

            // Get chapter_id from URL if present
            const targetChapterId = urlParams.get('chapter_id');
            let initialChapter = currentBook.chapters[0].id;
            
            if (targetChapterId) {
                // Verify the requested chapter exists in the filtered list
                const chapterExists = currentBook.chapters.some(c => c.id == targetChapterId);
                if (chapterExists) {
                    initialChapter = parseInt(targetChapterId);
                }
            }

            // Start with initial chapter
            currentChapterId = initialChapter;
            
            // Add chapter selector if there are any chapters
            if (currentBook.chapters.length > 0) {
                addChapterSelector(); 
            }
            
            displayChapter(currentChapterId);
        }

        function addChapterSelector() {
            const headerContent = document.querySelector('.reader-header-content');
            const bookInfo = headerContent.querySelector('.book-info-header');
            
            // Create chapter selector
            const chapterSelectorDiv = document.createElement('div');
            chapterSelectorDiv.style.cssText = 'margin-top: 0.5rem;';
            
            const select = document.createElement('select');
            select.style.cssText = `
                padding: 0.5rem 1rem;
                border: 2px solid var(--primary);
                border-radius: var(--radius-md);
                background: white;
                color: var(--dark);
                font-weight: 600;
                cursor: pointer;
            `;
            
            currentBook.chapters.forEach(chapter => {
                const option = document.createElement('option');
                option.value = chapter.id;
                option.textContent = chapter.title;
                select.appendChild(option);
            });
            
            select.addEventListener('change', function() {
                currentChapterId = parseInt(this.value);
                displayChapter(currentChapterId);
            });
            
            chapterSelectorDiv.appendChild(select);
            bookInfo.appendChild(chapterSelectorDiv);
        }

        function displayChapter(chapterId) {
            const chapter = currentBook.chapters.find(c => c.id === chapterId);
            if (!chapter) return;
            
            currentPageInChapter = 1;
            
            // Display content
            displayPage(1, chapter);
            
            // Update chapter selector if exists
            const selector = document.querySelector('select');
            if (selector) {
                selector.value = chapterId;
            }
            
            // Load chapter specific comments!
            loadComments();
            loadReactions();
        }

        function displayPage(pageNumber, chapter) {
            if (!chapter) {
                chapter = currentBook.chapters.find(c => c.id === currentChapterId);
            }
            
            currentPageInChapter = pageNumber;
            
            const page = chapter.pages[pageNumber - 1];
            if (!page) return;
            
            // Display content
            const storyContent = document.getElementById('story-content');
            let contentHtml = '';
            
            // Add draft badge if needed
            if (currentUser && currentUser.role === 'author' && chapter.status === 'draft') {
                contentHtml += `<div style="background: #fffeb3; color: #b45309; padding: 0.5rem; text-align: center; border-radius: var(--radius-sm); margin-bottom: 2rem; font-family: var(--font-primary); font-size: 0.875rem; font-weight: 600;">
                    <i class="fas fa-eye-slash"></i> DRAFT - Only visible to you
                </div>`;
            }
            
            contentHtml += `<div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="margin-bottom: 0.5rem; font-family: var(--font-display);">${chapter.title}</h2>
                <p style="color: var(--gray); font-style: italic; font-size: 0.9375rem; text-align: center;">By Malatië</p>
            </div>` + page.content;
            storyContent.innerHTML = contentHtml;
            
            // Update page info
            const totalPagesInChapter = chapter.pages.length;
            document.getElementById('page-info').textContent = `Page ${currentPageInChapter} of ${totalPagesInChapter}`;
            
            // Show/hide pagination controls
            const hasMultipleChapters = currentBook.chapters && currentBook.chapters.length > 0;
            
            // Selalu tampilkan pagination control jika ini buku format Webtoon (Chapters),
            // supaya walaupun baru ada 1 chapter 1 halaman, tombol "Next Chapter" tetap terlihat
            // (namun dalam posisi ter-disable / redup).
            if (totalPagesInChapter > 1 || hasMultipleChapters) {
                document.getElementById('pagination-controls').style.display = 'flex';
                document.getElementById('current-page').textContent = currentPageInChapter;
                document.getElementById('total-pages').textContent = totalPagesInChapter;
                
                // Update button states
                const prevBtn = document.getElementById('prev-page-btn');
                const nextBtn = document.getElementById('next-page-btn');
                
                const currentChapterIndex = currentBook.chapters.findIndex(c => c.id === currentChapterId);
                
                const isFirstPageOfFirstChapter = (currentChapterIndex === 0 && currentPageInChapter === 1);
                const isLastPageOfLastChapter = (currentChapterIndex === currentBook.chapters.length - 1 && currentPageInChapter === totalPagesInChapter);
                
                prevBtn.disabled = isFirstPageOfFirstChapter;
                nextBtn.disabled = isLastPageOfLastChapter;
                
                // Ganti text button jika pindah chapter
                if (currentPageInChapter === totalPagesInChapter && !isLastPageOfLastChapter) {
                    nextBtn.innerHTML = 'Next Chapter <i class="fas fa-chevron-right"></i>';
                } else {
                    nextBtn.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
                }
                
                if (currentPageInChapter === 1 && !isFirstPageOfFirstChapter) {
                    prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i> Prev Chapter';
                } else {
                    prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i> Previous';
                }
            } else {
                document.getElementById('pagination-controls').style.display = 'none';
            }
            

            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadLegacyBook() {
            // Old format - single story with page count
            const totalPages = currentBook.pages || 1;
            
            // Parse story into paragraphs
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = currentBook.story;
            
            // Get all paragraphs and headings
            const elements = tempDiv.querySelectorAll('p, h1, h2, h3, h4, h5, h6');
            const allParagraphs = Array.from(elements).map(el => el.outerHTML);

            // Show pagination if more than 1 page
            if (totalPages > 1) {
                document.getElementById('pagination-controls').style.display = 'flex';
            }

            // Display first page
            displayLegacyPage(1, allParagraphs, totalPages);
        }

        function displayLegacyPage(pageNumber, allParagraphs, totalPages) {
            // Calculate paragraphs per page
            const paragraphsPerPage = Math.ceil(allParagraphs.length / totalPages);
            const startIdx = (pageNumber - 1) * paragraphsPerPage;
            const endIdx = Math.min(startIdx + paragraphsPerPage, allParagraphs.length);
            
            // Get paragraphs for current page
            const pageParagraphs = allParagraphs.slice(startIdx, endIdx);
            
            // Display content
            const storyContent = document.getElementById('story-content');
            storyContent.innerHTML = pageParagraphs.join('');
            
            // Update page info
            document.getElementById('page-info').textContent = `Page ${pageNumber} of ${totalPages}`;
            document.getElementById('current-page').textContent = pageNumber;
            document.getElementById('total-pages').textContent = totalPages;
            
            // Update button states
            const prevBtn = document.getElementById('prev-page-btn');
            const nextBtn = document.getElementById('next-page-btn');
            
            prevBtn.disabled = pageNumber === 1;
            nextBtn.disabled = pageNumber === totalPages;
            
            // Update progress bar
            const progress = (pageNumber / totalPages) * 100;

            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextPage() {
            if (!currentBook.chapters) {
                // Legacy format - handle differently
                return;
            }
            
            const chapter = currentBook.chapters.find(c => c.id === currentChapterId);
            if (currentPageInChapter < chapter.pages.length) {
                displayPage(currentPageInChapter + 1, chapter);
            } else {
                // Last page of chapter - go to next chapter if exists
                const currentChapterIndex = currentBook.chapters.findIndex(c => c.id === currentChapterId);
                if (currentChapterIndex < currentBook.chapters.length - 1) {
                    currentChapterId = currentBook.chapters[currentChapterIndex + 1].id;
                    displayChapter(currentChapterId);
                    showNotification('Next chapter');
                }
            }
        }

        function previousPage() {
            if (!currentBook.chapters) {
                // Legacy format - handle differently
                return;
            }
            
            const chapter = currentBook.chapters.find(c => c.id === currentChapterId);
            if (currentPageInChapter > 1) {
                displayPage(currentPageInChapter - 1, chapter);
            } else {
                // First page of chapter - go to previous chapter if exists
                const currentChapterIndex = currentBook.chapters.findIndex(c => c.id === currentChapterId);
                if (currentChapterIndex > 0) {
                    const prevChapter = currentBook.chapters[currentChapterIndex - 1];
                    currentChapterId = prevChapter.id;
                    currentPageInChapter = prevChapter.pages.length; // Go to last page of previous chapter
                    displayPage(currentPageInChapter, prevChapter);
                    showNotification('Previous chapter');
                }
            }
        }

                padding: 1rem 1.5rem;
                border-radius: 1rem;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
                z-index: 3000;
                animation: slideUp 0.3s ease;
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        function closeReader() {
            // Check if user came from within the site, but NOT from the share redirect script
            const isInternal = document.referrer && 
                             document.referrer.includes(window.location.host) && 
                             !document.referrer.includes('/api/share');
                             
            if (window.history.length > 1 && isInternal) {
                window.history.back();
            } else {
                // If they came from outside (WhatsApp/Discord/Share Link), fallback to Home
                window.location.href = 'index.html';
            }
        }

        // Share functionality
        async function shareStory() {
            if (!currentBook) return;

            const baseUrl = window.location.origin;
            let shareUrl = currentBook.id ? `${baseUrl}/api/share?id=${currentBook.id}` : window.location.href;
            let chapterTitle = '';

            if (currentBook.chapters && currentChapterId) {
                const chapter = currentBook.chapters.find(c => c.id === currentChapterId);
                if (chapter) {
                    chapterTitle = chapter.title;
                    shareUrl += `&chapter_id=${currentChapterId}`;
                }
            }

            const title = `${currentBook.title} - ArchazzBook`;
            const text = chapterTitle ? `Read "${currentBook.title} - ${chapterTitle}" on ArchazzBook!` : `Read "${currentBook.title}" on ArchazzBook!`;

            const shareData = {
                title: title,
                text: text,
                url: shareUrl
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Fallback for desktop/unsupported browsers
                    await navigator.clipboard.writeText(shareUrl);
                    showNotification('Link copied to clipboard!');
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('Error sharing:', err);
                    try {
                        await navigator.clipboard.writeText(shareUrl);
                        showNotification('Link copied to clipboard!');
                    } catch (copyErr) {
                        showNotification('Failed to copy link. Check your permissions.');
                    }
                }
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                previousPage();
            } else if (e.key === 'ArrowRight') {
                nextPage();
            }
        });
    </script>
</body>
</html>
