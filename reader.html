<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader - ArchazzBook</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .reader-container {
            min-height: 100vh;
            background: var(--gray-lighter);
            padding-top: 80px;
        }
        
        .reader-header {
            background: white;
            padding: 1rem 2rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
        }
        
        .reader-header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .book-info-header {
            flex: 1;
        }
        
        .book-info-header h1 {
            font-size: 1.5rem;
            font-family: var(--font-display);
            margin-bottom: 0.25rem;
        }
        
        .book-info-header p {
            color: var(--gray);
            font-size: 0.875rem;
        }
        
        .reader-controls {
            display: flex;
            gap: 1rem;
        }
        
        .reader-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }
        
        /* A4 Paper Size - 210mm x 297mm ratio (1:1.414) */
        .reader-paper {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            padding: 3rem 2.5rem;
            /* A4 aspect ratio with max-width */
            max-width: 21cm;
            min-height: 29.7cm;
            margin: 0 auto;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--dark-light);
            position: relative;
        }
        
        .reader-paper h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--dark);
        }
        
        .reader-paper p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }
        
        /* Page Info Badge */
        .page-info {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            font-family: var(--font-primary);
        }
        
        /* Pagination Controls */
        .reader-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .pagination-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-fast);
            font-weight: 600;
        }
        
        .pagination-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .pagination-info {
            font-weight: 600;
            color: var(--dark);
            padding: 0.75rem 1rem;
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }
        
        .reader-navigation {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .reader-settings {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .settings-btn {
            width: 48px;
            height: 48px;
            border: none;
            background: var(--gray-lighter);
            color: var(--dark);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: var(--transition-fast);
        }
        
        .settings-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        .settings-btn.active {
            background: var(--primary);
            color: white;
        }
        

        
        
        @media (max-width: 768px) {
            .reader-content {
                padding: 0 1.25rem 3rem;
            }
            
            .reader-paper {
                padding: 2rem 1.5rem;
                min-height: auto;
                font-size: 1rem;
            }
            
            .reader-paper h2 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }
            
            .reader-settings {
                position: static;
                transform: none;
                flex-direction: row;
                margin: 0 1.25rem 1.5rem;
                justify-content: center;
            }
            
            .settings-btn {
                width: 44px;
                height: 44px;
                font-size: 1.125rem;
            }
            
            .reader-header {
                padding: 1rem 1.25rem;
            }
            
            .reader-header-content {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            
            .reader-controls {
                width: 100%;
                justify-content: flex-end;
            }
            
            .pagination-btn {
                padding: 0.625rem 1rem;
                font-size: 0.875rem;
            }
            
            .reader-pagination {
                gap: 1rem;
            }
            
            .pagination-info {
                padding: 0.625rem 0.875rem;
                font-size: 0.875rem;
            }
        }
        
        @media (max-width: 480px) {
            .reader-content {
                padding: 0 1rem 2rem;
            }
            
            .reader-paper {
                padding: 1.5rem 1rem;
                font-size: 0.9375rem;
                line-height: 1.7;
            }
            
            .reader-paper h2 {
                font-size: 1.25rem;
                margin-bottom: 1.25rem;
            }
            
            .page-info {
                font-size: 0.6875rem;
                padding: 0.375rem 0.75rem;
            }
            
            .reader-header {
                padding: 0.875rem 1rem;
            }
            
            .book-info-header h1 {
                font-size: 1.125rem;
            }
            
            .book-info-header p {
                font-size: 0.8125rem;
            }
            
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }
            
            .settings-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .reader-settings {
                margin: 0 1rem 1.25rem;
                gap: 0.75rem;
            }
            
            .pagination-btn {
                padding: 0.5rem 0.875rem;
                font-size: 0.8125rem;
            }
            
            .pagination-info {
                padding: 0.5rem 0.75rem;
                font-size: 0.8125rem;
            }
            
            .reader-pagination {
                gap: 0.75rem;
                margin-top: 1.5rem;
            }
        }
        
        /* Comments Section Styles */
        .comments-container {
            max-width: 800px;
            margin: 3rem auto 0;
            background: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .comments-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--gray-lighter);
            padding-bottom: 1rem;
        }

        .comments-header h3 {
            font-size: 1.25rem;
            color: var(--dark);
            margin: 0;
        }

        .badge {
            background: var(--gray-lighter);
            color: var(--gray);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .comment {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: var(--gray-lighter);
            border-radius: var(--radius-md);
            transition: var(--transition-fast);
        }

        .comment:hover {
            box-shadow: var(--shadow-sm);
        }

        .comment.author {
            background: #EEF2FF; /* Light Indigo */
            border: 1px solid #C7D2FE;
        }
        
        .comment.author .comment-author-name {
            color: var(--primary);
        }
        
        .comment.author .comment-author-name::after {
            content: 'Author';
            background: var(--primary);
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .comment.reply {
            margin-left: 3rem;
            border-left: 3px solid var(--gray-light);
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .comment.author .comment-avatar {
            background: var(--gradient-primary);
        }

        .comment-body {
            flex: 1;
        }

        .comment-header-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .comment-author-name {
            font-weight: 600;
            color: var(--dark);
            font-size: 0.9rem;
        }

        .comment-time {
            font-size: 0.75rem;
            color: var(--gray);
        }

        .comment-text {
            color: var(--dark-light);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .comment-actions {
            margin-top: 0.5rem;
            display: flex;
            gap: 1rem;
        }

        .reply-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .reply-btn:hover {
            text-decoration: underline;
        }
        
        .action-btn {
            background: none;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.2s;
        }
        
        .edit-btn {
           color: var(--accent);
        }
        
        .edit-btn:hover {
            color: #d97706; /* darker amber */
        }

        .delete-btn {
            color: #ef4444; /* red-500 */
        }
        
        .delete-btn:hover {
            color: #b91c1c; /* red-700 */
        }

        .comment-form {
            background: var(--gray-lighter);
            padding: 1.5rem;
            border-radius: var(--radius-md);
        }

        .comment-form h4 {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .comment-form textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-light);
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-family: inherit;
            resize: vertical;
        }
        
        .loading-spinner {
            text-align: center;
            color: var(--gray);
            padding: 2rem;
        }
    
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-book-open"></i>
                <span>ArchazzBook</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-arrow-left"></i> Back to Library
                </a>
            </div>
        </div>
    </nav>



    <!-- Reader -->
    <div class="reader-container">
        <!-- Header -->
        <div class="reader-header">
            <div class="reader-header-content">
                <div class="book-info-header">
                    <h1 id="reader-book-title">Loading...</h1>
                    <p>by <span id="reader-book-author">Archazz</span></p>
                </div>
                <div class="reader-controls">
                    <button class="btn btn-outline" onclick="window.history.back()">
                        <i class="fas fa-times"></i> Close
                    </button>
                </div>
            </div>
        </div>

        <!-- Reading Settings -->
        <div class="reader-settings">
            <button class="settings-btn" onclick="decreaseFontSize()" title="Decrease font size">
                <i class="fas fa-minus"></i>
            </button>
            <button class="settings-btn active" onclick="resetFontSize()" title="Reset font size">
                <i class="fas fa-font"></i>
            </button>
            <button class="settings-btn" onclick="increaseFontSize()" title="Increase font size">
                <i class="fas fa-plus"></i>
            </button>
            <div style="height: 1px; background: var(--gray-lighter); margin: 0.5rem 0;"></div>
            <button class="settings-btn" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <!-- Content -->
        <div class="reader-content">
            <div class="reader-paper" id="reader-paper">
                <div class="page-info" id="page-info">Page 1 of 1</div>
                <div id="story-content">
                    <!-- Story will be loaded here -->
                </div>
            </div>

            <!-- Pagination Controls -->
            <div class="reader-pagination" id="pagination-controls" style="display: none;">
                <button class="pagination-btn" id="prev-page-btn" onclick="previousPage()">
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <div class="pagination-info">
                    Page <span id="current-page">1</span> of <span id="total-pages">1</span>
                </div>
                <button class="pagination-btn" id="next-page-btn" onclick="nextPage()">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <!-- Comments Section -->
            <div id="comments-section" class="comments-container">
                <div class="comments-header">
                    <h3><i class="fas fa-comments"></i> Comments</h3>
                    <span id="comments-count" class="badge">0</span>
                </div>

                <div id="comments-list" class="comments-list">
                    <!-- Comments will be loaded here -->
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i> Loading comments...
                    </div>
                </div>

                <div class="comment-form">
                    <h4>Leave a comment</h4>
                    <div class="form-group">
                        <textarea id="comment-input" placeholder="Share your thoughts about this story..." rows="3"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="postComment()">
                        <i class="fas fa-paper-plane"></i> Post Comment
                    </button>
                </div>
            </div>

            <div class="reader-navigation">
                <button class="btn btn-large btn-outline" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i> Back to Library
                </button>
            </div>
        </div>
    </div>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Configuration -->
    <script src="supabase-config.js"></script>
    
    <!-- App Logic -->
    <script src="app.js"></script>
    <script>
        let currentFontSize = 1.125; // rem
        let isDarkMode = false;
        let currentChapterId = null;
        let currentPageInChapter = 1;
        let currentBook = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadBook();
            loadComments();
        });

        // --- Comments Logic ---
        
        async function loadComments() {
            if (!currentBook || !window.SupabaseAPI) return;
            
            const commentsList = document.getElementById('comments-list');
            const commentsCount = document.getElementById('comments-count');
            
            try {
                const comments = await window.SupabaseAPI.fetchComments(currentBook.id);
                
                commentsCount.textContent = comments.length;
                
                if (comments.length === 0) {
                    commentsList.innerHTML = `
                        <div style="text-align: center; color: var(--gray); padding: 2rem;">
                            <i class="far fa-comment-dots" style="font-size: 2rem; margin-bottom: 0.5rem;"></i>
                            <p>No comments yet. Be the first to share your thoughts!</p>
                        </div>
                    `;
                    return;
                }
                
                commentsList.innerHTML = ''; // Clear loading/empty message
                
                // Process comments to handle threading (simplistic 1-level for now or flat list ordered by time)
                // Since our query fetches all ordered by time, we just render them.
                // If we want nested replies, we'd need to organize them. 
                // For simplicity, let's render strictly chronologically but indent replies if parent_id exists
                
                // First pass: Map ID to comment for lookup
                const commentMap = {};
                comments.forEach(c => commentMap[c.id] = c);
                
                // Separate roots and replies
                const rootComments = comments.filter(c => !c.parent_id);
                const replies = comments.filter(c => c.parent_id);
                
                // Helper to render
                const renderComment = (comment, isReply = false) => {
                    const div = document.createElement('div');
                    div.className = `comment ${comment.is_author ? 'author' : ''} ${isReply ? 'reply' : ''}`;
                    div.id = `comment-${comment.id}`;
                    
                    const initials = comment.author_name.substring(0, 2).toUpperCase();
                    const timeAgo = formatTimeAgo(new Date(comment.created_at));
                    
                    // Check if current user is author to show Reply/Edit/Delete buttons
                    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
                    const isAuthorUser = currentUser && currentUser.role === 'author';
                    
                    let actionsHtml = '';
                    if (isAuthorUser) {
                         actionsHtml = `
                            <button class="action-btn reply-btn" onclick="startReply(${comment.id}, '${comment.author_name}')">
                                <i class="fas fa-reply"></i> Reply
                            </button>
                            <button class="action-btn edit-btn" onclick="startEdit(${comment.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteCommentNode(${comment.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        `;
                    }

                    div.innerHTML = `
                        <div class="comment-avatar">${initials}</div>
                        <div class="comment-body">
                            <div class="comment-header-row">
                                <span class="comment-author-name">${comment.author_name}</span>
                                <span class="comment-time">${timeAgo}</span>
                            </div>
                            <div class="comment-content-wrapper" id="content-${comment.id}">
                                <div class="comment-text">${escapeHtml(comment.content)}</div>
                                <div class="comment-actions">
                                    ${actionsHtml}
                                </div>
                            </div>
                            <div class="edit-form" id="edit-form-${comment.id}" style="display: none; margin-top: 0.5rem;">
                                <textarea class="edit-input" rows="2" style="width: 100%; border: 1px solid var(--gray-light); border-radius: var(--radius-sm); padding: 0.5rem;"></textarea>
                                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                                    <button class="btn btn-sm btn-primary" onclick="saveEdit(${comment.id})">Save</button>
                                    <button class="btn btn-sm btn-outline" onclick="cancelEdit(${comment.id})">Cancel</button>
                                </div>
                            </div>
                        </div>
                    `;
                    // Store content for edit
                    div.dataset.content = comment.content;
                    return div;
                };

                // Render roots then their replies
                rootComments.forEach(root => {
                    commentsList.appendChild(renderComment(root));
                    
                    // Find direct replies
                    const myReplies = replies.filter(r => r.parent_id === root.id);
                    myReplies.forEach(reply => {
                       commentsList.appendChild(renderComment(reply, true)); 
                    });
                });
                
            } catch (error) {
                console.error('Error loading comments:', error);
                commentsList.innerHTML = '<p class="text-center">Failed to load comments.</p>';
            }
        }
        
        // --- Actions ---

        async function deleteCommentNode(id) {
            if (!confirm('Are you sure you want to delete this comment?')) return;
            
            try {
                // Optimistic removal
                const el = document.getElementById(`comment-${id}`);
                if (el) el.style.opacity = '0.5';
                
                await window.SupabaseAPI.deleteComment(id);
                showNotification('Comment deleted');
                loadComments(); // Refresh to be safe
            } catch (e) {
                alert('Failed to delete comment');
                loadComments();
            }
        }

        function startEdit(id) {
            const commentEl = document.getElementById(`comment-${id}`);
            const contentWrapper = document.getElementById(`content-${id}`);
            const editForm = document.getElementById(`edit-form-${id}`);
            const textarea = editForm.querySelector('textarea');
            
            // Populate
            textarea.value = commentEl.dataset.content;
            
            // Toggle
            contentWrapper.style.display = 'none';
            editForm.style.display = 'block';
        }

        function cancelEdit(id) {
            const contentWrapper = document.getElementById(`content-${id}`);
            const editForm = document.getElementById(`edit-form-${id}`);
            
            contentWrapper.style.display = 'block';
            editForm.style.display = 'none';
        }

        async function saveEdit(id) {
            const editForm = document.getElementById(`edit-form-${id}`);
            const textarea = editForm.querySelector('textarea');
            const newContent = textarea.value.trim();
            
            if (!newContent) return alert('Comment cannot be empty');
            
            try {
                await window.SupabaseAPI.updateComment(id, newContent);
                showNotification('Comment updated');
                loadComments();
            } catch (e) {
                alert('Failed to update comment');
            }
        }
        
        let replyToId = null;
        
        function startReply(commentId, authorName) {
            replyToId = commentId;
            const textarea = document.getElementById('comment-input');
            textarea.placeholder = `Replying to ${authorName}...`;
            textarea.focus();
            
            // Scroll to form
            document.querySelector('.comment-form').scrollIntoView({ behavior: 'smooth' });
        }

        async function postComment() {
            const input = document.getElementById('comment-input');
            const content = input.value.trim();
            
            if (!content) {
                alert('Please enter a comment.');
                return;
            }
            
            // Identity logic
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
            const isAuthor = currentUser && currentUser.role === 'author';
            
            // Random name for anon, or 'Archazz' for author
            let authorName = 'Anonymous';
            if (isAuthor) {
                authorName = 'Archazz'; // Or currentUser.name
            } else {
                const adjectives = ['Happy', 'Curious', 'Quiet', 'Loud', 'Mystery', 'Brave'];
                const animals = ['Reader', 'Bookworm', 'Cat', 'Owl', 'Fox', 'Panda'];
                const randAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
                const randAni = animals[Math.floor(Math.random() * animals.length)];
                authorName = `${randAdj} ${randAni}`;
            }

            try {
                // Show temporary state
                const btn = document.querySelector('.comment-form button');
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting...';
                
                const commentData = {
                    book_id: currentBook.id,
                    content: content,
                    author_name: authorName,
                    is_author: isAuthor,
                    parent_id: replyToId
                };
                
                await window.SupabaseAPI.createComment(commentData);
                
                // Reset form
                input.value = '';
                replyToId = null;
                input.placeholder = "Share your thoughts about this story...";
                btn.disabled = false;
                btn.innerHTML = originalText;
                
                showNotification('Comment posted!');
                loadComments(); // Refresh list
                
            } catch (error) {
                console.error('Error posting comment:', error);
                alert('Failed to post comment: ' + (error.message || JSON.stringify(error)));
                
                // Reset button
                const btn = document.querySelector('.comment-form button');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Post Comment';
            }
        }

        function formatTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m ago";
            return "Just now";
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        async function loadBook() {
            // Get book ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = parseInt(urlParams.get('id'));

            if (!bookId) {
                alert('Book not found');
                window.location.href = 'index.html';
                return;
            }

            // Get books from localStorage
            const savedBooks = localStorage.getItem('books');
            let books = [];
            
            if (savedBooks) {
                books = JSON.parse(savedBooks);
            } else if (window.ArchazzBook && window.ArchazzBook.books) {
                books = window.ArchazzBook.books;
            }

            let book = books.find(b => b.id === bookId);

            // If not found in localStorage, and we have Supabase, try fetching
            if (!book && window.SupabaseAPI) {
                try {
                    const onlineBooks = await window.SupabaseAPI.fetchBooks();
                    book = onlineBooks.find(b => b.id === bookId);
                    
                    // If consistent with app.js implementation, we might want to update local cache
                    // but for now just using it is enough for the reader
                } catch (e) {
                    console.error('Failed to fetch from Supabase in reader', e);
                }
            }

            if (!book) {
                alert('Book not found');
                window.location.href = 'index.html';
                return;
            }

            currentBook = book;

            // Display book info
            // Handle both legacy (localStorage) and Supabase field names
            const authorName = book.author || book.author_name || 'Archazz';
            document.getElementById('reader-book-title').textContent = book.title;
            document.getElementById('reader-book-author').textContent = authorName;
            document.title = `${book.title} - ArchazzBook`;

            // Check if book has chapter-based structure
            if (book.chapters && book.chapters.length > 0) {
                // New chapter-based format
                loadChapterBasedBook();
            } else {
                // Old single-story format - convert for backwards compatibility
                loadLegacyBook();
            }
        }

        function loadChapterBasedBook() {
            // Start with first chapter
            currentChapterId = currentBook.chapters[0].id;
            
            // Add chapter selector if multiple chapters
            if (currentBook.chapters.length > 1) {
                addChapterSelector();
            }
            
            displayChapter(currentChapterId);
        }

        function addChapterSelector() {
            const headerContent = document.querySelector('.reader-header-content');
            const bookInfo = headerContent.querySelector('.book-info-header');
            
            // Create chapter selector
            const chapterSelectorDiv = document.createElement('div');
            chapterSelectorDiv.style.cssText = 'margin-top: 0.5rem;';
            
            const select = document.createElement('select');
            select.style.cssText = `
                padding: 0.5rem 1rem;
                border: 2px solid var(--primary);
                border-radius: var(--radius-md);
                background: white;
                color: var(--dark);
                font-weight: 600;
                cursor: pointer;
            `;
            
            currentBook.chapters.forEach(chapter => {
                const option = document.createElement('option');
                option.value = chapter.id;
                option.textContent = chapter.title;
                select.appendChild(option);
            });
            
            select.addEventListener('change', function() {
                currentChapterId = parseInt(this.value);
                displayChapter(currentChapterId);
            });
            
            chapterSelectorDiv.appendChild(select);
            bookInfo.appendChild(chapterSelectorDiv);
        }

        function displayChapter(chapterId) {
            const chapter = currentBook.chapters.find(c => c.id === chapterId);
            if (!chapter) return;
            
            currentPageInChapter = 1;
            
            // Display content
            displayPage(1, chapter);
            
            // Update chapter selector if exists
            const selector = document.querySelector('select');
            if (selector) {
                selector.value = chapterId;
            }
        }

        function displayPage(pageNumber, chapter) {
            if (!chapter) {
                chapter = currentBook.chapters.find(c => c.id === currentChapterId);
            }
            
            currentPageInChapter = pageNumber;
            
            const page = chapter.pages[pageNumber - 1];
            if (!page) return;
            
            // Display content
            const storyContent = document.getElementById('story-content');
            storyContent.innerHTML = `<h2>${chapter.title}</h2>` + page.content;
            
            // Update page info
            const totalPagesInChapter = chapter.pages.length;
            document.getElementById('page-info').textContent = `Page ${currentPageInChapter} of ${totalPagesInChapter}`;
            
            // Show/hide pagination controls
            if (totalPagesInChapter > 1) {
                document.getElementById('pagination-controls').style.display = 'flex';
                document.getElementById('current-page').textContent = currentPageInChapter;
                document.getElementById('total-pages').textContent = totalPagesInChapter;
                
                // Update button states
                const prevBtn = document.getElementById('prev-page-btn');
                const nextBtn = document.getElementById('next-page-btn');
                
                prevBtn.disabled = currentPageInChapter === 1;
                nextBtn.disabled = currentPageInChapter === totalPagesInChapter;
            } else {
                document.getElementById('pagination-controls').style.display = 'none';
            }
            

            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadLegacyBook() {
            // Old format - single story with page count
            const totalPages = currentBook.pages || 1;
            
            // Parse story into paragraphs
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = currentBook.story;
            
            // Get all paragraphs and headings
            const elements = tempDiv.querySelectorAll('p, h1, h2, h3, h4, h5, h6');
            const allParagraphs = Array.from(elements).map(el => el.outerHTML);

            // Show pagination if more than 1 page
            if (totalPages > 1) {
                document.getElementById('pagination-controls').style.display = 'flex';
            }

            // Display first page
            displayLegacyPage(1, allParagraphs, totalPages);
        }

        function displayLegacyPage(pageNumber, allParagraphs, totalPages) {
            // Calculate paragraphs per page
            const paragraphsPerPage = Math.ceil(allParagraphs.length / totalPages);
            const startIdx = (pageNumber - 1) * paragraphsPerPage;
            const endIdx = Math.min(startIdx + paragraphsPerPage, allParagraphs.length);
            
            // Get paragraphs for current page
            const pageParagraphs = allParagraphs.slice(startIdx, endIdx);
            
            // Display content
            const storyContent = document.getElementById('story-content');
            storyContent.innerHTML = pageParagraphs.join('');
            
            // Update page info
            document.getElementById('page-info').textContent = `Page ${pageNumber} of ${totalPages}`;
            document.getElementById('current-page').textContent = pageNumber;
            document.getElementById('total-pages').textContent = totalPages;
            
            // Update button states
            const prevBtn = document.getElementById('prev-page-btn');
            const nextBtn = document.getElementById('next-page-btn');
            
            prevBtn.disabled = pageNumber === 1;
            nextBtn.disabled = pageNumber === totalPages;
            
            // Update progress bar
            const progress = (pageNumber / totalPages) * 100;

            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextPage() {
            if (!currentBook.chapters) {
                // Legacy format - handle differently
                return;
            }
            
            const chapter = currentBook.chapters.find(c => c.id === currentChapterId);
            if (currentPageInChapter < chapter.pages.length) {
                displayPage(currentPageInChapter + 1, chapter);
            } else {
                // Last page of chapter - go to next chapter if exists
                const currentChapterIndex = currentBook.chapters.findIndex(c => c.id === currentChapterId);
                if (currentChapterIndex < currentBook.chapters.length - 1) {
                    currentChapterId = currentBook.chapters[currentChapterIndex + 1].id;
                    displayChapter(currentChapterId);
                    showNotification('Next chapter');
                }
            }
        }

        function previousPage() {
            if (!currentBook.chapters) {
                // Legacy format - handle differently
                return;
            }
            
            const chapter = currentBook.chapters.find(c => c.id === currentChapterId);
            if (currentPageInChapter > 1) {
                displayPage(currentPageInChapter - 1, chapter);
            } else {
                // First page of chapter - go to previous chapter if exists
                const currentChapterIndex = currentBook.chapters.findIndex(c => c.id === currentChapterId);
                if (currentChapterIndex > 0) {
                    const prevChapter = currentBook.chapters[currentChapterIndex - 1];
                    currentChapterId = prevChapter.id;
                    currentPageInChapter = prevChapter.pages.length; // Go to last page of previous chapter
                    displayPage(currentPageInChapter, prevChapter);
                    showNotification('Previous chapter');
                }
            }
        }



        function increaseFontSize() {
            currentFontSize += 0.125;
            if (currentFontSize > 2) currentFontSize = 2;
            updateFontSize();
        }

        function decreaseFontSize() {
            currentFontSize -= 0.125;
            if (currentFontSize < 0.875) currentFontSize = 0.875;
            updateFontSize();
        }

        function resetFontSize() {
            currentFontSize = 1.125;
            updateFontSize();
        }

        function updateFontSize() {
            document.getElementById('reader-paper').style.fontSize = `${currentFontSize}rem`;
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const paper = document.getElementById('reader-paper');
            const themeBtn = document.getElementById('theme-btn');
            
            if (isDarkMode) {
                paper.style.background = '#1E293B';
                paper.style.color = '#E2E8F0';
                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                paper.style.background = 'white';
                paper.style.color = '#1E293B';
                themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                bottom: 2rem;
                right: 2rem;
                background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 1rem;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
                z-index: 3000;
                animation: slideUp 0.3s ease;
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                previousPage();
            } else if (e.key === 'ArrowRight') {
                nextPage();
            }
        });
    </script>
</body>
