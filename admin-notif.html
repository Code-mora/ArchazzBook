<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notification Sender - ArchazzBook</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { padding: 40px; background: #f1f5f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { margin-bottom: 20px; color: #0f172a; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; }
        button { background: #6366f1; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; font-size: 16px; transition: 0.2s; }
        button:hover { background: #4f46e5; }
        .status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .token-count { background: #e0f2fe; color: #0369a1; padding: 8px 12px; border-radius: 6px; font-size: 14px; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-paper-plane"></i> Send Notification</h1>
    
    <div id="stats" class="token-count">Loading subscribers...</div>

    <div class="form-group">
        <label>Target Audience</label>
        <select id="target">
            <option value="all">All Subscribers (Broadcast)</option>
            <option value="debug">My Current Browser Only (Test)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Title</label>
        <input type="text" id="title" placeholder="e.g. New Chapter Released!" value="New Update from Archazz!">
    </div>

    <div class="form-group">
        <label>Body</label>
        <textarea id="body" rows="3" placeholder="e.g. Chapter 5 is now available. Click to read.">Helo, ada update terbaru nih di ArchazzBook. Yuk cek!</textarea>
    </div>

    <div class="form-group">
        <label>Click Action URL (Optional)</label>
        <input type="text" id="url" value="https://archazzbook.com" placeholder="https://...">
    </div>

    <button onclick="sendNotification()" id="send-btn">
        <i class="fas fa-rocket"></i> Send Notification
    </button>

    <div id="status-box" class="status"></div>
</div>

<!-- Firebase & Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
    // SERVER KEY (Legacy)
    const SERVER_KEY = 'AIzaSyC5rkrZtTmLZyv7TrhTp4xLQ1IWQ6fmb84'; 

    async function loadStats() {
        const { count, error } = await window.supabaseClient
            .from('fcm_tokens')
            .select('*', { count: 'exact', head: true });
        
        if (error) {
            document.getElementById('stats').textContent = 'Error loading stats';
        } else {
            document.getElementById('stats').textContent = `👥 Total Subscribers: ${count}`;
        }
    }

    loadStats();

    async function sendNotification() {
        const btn = document.getElementById('send-btn');
        const statusBox = document.getElementById('status-box');
        const target = document.getElementById('target').value;
        const title = document.getElementById('title').value;
        const body = document.getElementById('body').value;
        const clickUrl = document.getElementById('url').value;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-cog fa-spin"></i> Generating Command...';
        statusBox.style.display = 'none';

        try {
            let tokens = [];

            if (target === 'debug') {
                const myId = localStorage.getItem('archazz_browser_id');
                const { data } = await window.supabaseClient
                    .from('fcm_tokens')
                    .select('fcm_token')
                    .eq('browser_id', myId)
                    .single();
                
                if (data) tokens.push(data.fcm_token);
                else throw new Error("Your browser token not found in DB. Did you click Allow?");

            } else {
                const { data } = await window.supabaseClient
                    .from('fcm_tokens')
                    .select('fcm_token')
                    .limit(1); // Sample 1 for testing
                
                if (data && data.length > 0) tokens.push(data[0].fcm_token);
            }

            if (tokens.length === 0) {
                throw new Error("No target tokens found.");
            }

            const targetToken = tokens[0];
            
            // Generate PowerShell Command
            const psCommand = `
$headers = @{
  "Authorization" = "key=${SERVER_KEY}"
  "Content-Type" = "application/json"
}

$body = @{
  "to" = "${targetToken}"
  "notification" = @{
    "title" = "${title}"
    "body" = "${body}"
    "icon" = "https://cdn-icons-png.flaticon.com/512/2232/2232688.png"
    "click_action" = "${clickUrl}"
  }
} | ConvertTo-Json

Invoke-RestMethod -Uri "https://fcm.googleapis.com/fcm/send" -Method Post -Headers $headers -Body $body
`;

            // Display Command
            const cleanCommand = psCommand.trim();
            
            showStatus(`
                <strong>✅ Command Generated!</strong><br>
                Copy kode di bawah ini, lalu Paste di Terminal VS Code (PowerShell):
                <textarea onclick="this.select()" style="margin-top:10px; height:150px; font-family:monospace; font-size:12px;">${cleanCommand}</textarea>
            `, 'success');

        } catch (err) {
            console.error(err);
            showStatus(`❌ Error: ${err.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-terminal"></i> Generate Command';
        }
    }

    function showStatus(html, type) {
        const box = document.getElementById('status-box');
        box.innerHTML = html;
        box.className = `status ${type}`;
        box.style.display = 'block';
    }
</script>

</body>
</html>
