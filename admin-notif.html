<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notification Sender - ArchazzBook</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { padding: 40px; background: #f1f5f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { margin-bottom: 20px; color: #0f172a; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; }
        button { background: #6366f1; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; font-size: 16px; transition: 0.2s; }
        button:hover { background: #4f46e5; }
        .status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .token-count { background: #e0f2fe; color: #0369a1; padding: 8px 12px; border-radius: 6px; font-size: 14px; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-paper-plane"></i> Send Notification</h1>
    
    <div id="stats" class="token-count">Loading subscribers...</div>

    <div class="form-group">
        <label>Target Audience</label>
        <select id="target">
            <option value="all">All Subscribers (Broadcast)</option>
            <option value="debug">My Current Browser Only (Test)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Title</label>
        <input type="text" id="title" placeholder="e.g. New Chapter Released!" value="New Update from Archazz!">
    </div>

    <div class="form-group">
        <label>Body</label>
        <textarea id="body" rows="3" placeholder="e.g. Chapter 5 is now available. Click to read.">Helo, ada update terbaru nih di ArchazzBook. Yuk cek!</textarea>
    </div>

    <div class="form-group">
        <label>Click Action URL (Optional)</label>
        <input type="text" id="url" value="https://archazzbook.com" placeholder="https://...">
    </div>

    <button onclick="sendNotification()" id="send-btn">
        <i class="fas fa-rocket"></i> Send Notification
    </button>
    
    <button onclick="checkDatabaseIds()" class="btn-micro" style="margin-top:10px; background:#333; font-size:0.7em; padding:5px 10px;">
        🔍 Debug: Cek Data DB
    </button>

    <div id="status-box" class="status"></div>
</div>

<!-- Firebase & Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
    async function loadStats() {
        const { count, error } = await window.supabaseClient
            .from('fcm_tokens')
            .select('*', { count: 'exact', head: true });
        
        if (error) {
            document.getElementById('stats').textContent = 'Error loading stats';
        } else {
            document.getElementById('stats').textContent = `👥 Total Subscribers: ${count}`;
        }
    }

    loadStats();

    async function sendNotification() {
        const btn = document.getElementById('send-btn');
        const statusBox = document.getElementById('status-box');
        const target = document.getElementById('target').value;
        const title = document.getElementById('title').value;
        const body = document.getElementById('body').value;
        const clickUrl = document.getElementById('url').value;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending via Vercel API...';
        statusBox.style.display = 'none';

        try {
            let tokens = [];

            if (target === 'debug') {
                const myId = getOrGenerateBrowserId();
                const { data } = await window.supabaseClient
                    .from('fcm_tokens')
                    .select('fcm_token')
                    .eq('browser_id', myId)
                    .single();
                
                if (data) tokens.push(data.fcm_token);
                else throw new Error("Your browser token not found in DB. Did you click Allow?");

            } else {
                const { data } = await window.supabaseClient
                    .from('fcm_tokens')
                    .select('fcm_token')
                    .limit(10); // Limit broadcast to 10 for safety test
                
                if (data && data.length > 0) tokens = data.map(t => t.fcm_token);
            }

            if (tokens.length === 0) {
                throw new Error("No target tokens found.");
            }

            console.log(`Sending to ${tokens.length} devices...`);
            let successCount = 0;
            let failCount = 0;

            // Send to each token via our Vercel API
            // Note: In a real production app, you'd send the array of tokens to the API 
            // and let the server handle the loop/batching.
            // For this simple version, we loop here.
            for (const token of tokens) {
                try {
                    const response = await fetch('/api/send-push', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: token,
                            title: title,
                            body: body,
                            url: clickUrl,
                            icon: window.location.origin + '/assets/images/logo-archazz.png',
                            image: window.location.origin + '/assets/images/logo-archazz.png'
                        })
                    });

                    // Check response status before parsing JSON
                    if (!response.ok) {
                        console.error('HTTP Error:', response.status, response.statusText);
                        failCount++;
                        continue;
                    }

                    // Tambahan debug untuk membantu trace jika backend bukan Vercel
                    const textResponse = await response.text();
                    try {
                        const result = JSON.parse(textResponse);
                        if (result.success) {
                            successCount++;
                        } else {
                            console.error('API Error:', result);
                            failCount++;
                        }
                    } catch (parseError) {
                        console.error('Parse JSON Error (Mungkin backend mengembalikan HTML/JS mentah):', textResponse.substring(0, 100));
                        failCount++;
                        // Jika melempar syntax error pada text JS function (Vercel)
                        if (textResponse.includes('export default')) {
                            alert('🚨 ERROR BACKEND: Endpoint /api/send-push.js tidak dijalankan sebagai API oleh server. Ini terjadi jika kamu host di AlwaysData/Github Pages tanpa Vercel.');
                            throw new Error('Backend returns raw JS. Must deploy /api folder to Vercel.');
                        }
                    }
                } catch (e) {
                    console.error('Fetch Error:', e);
                    failCount++;
                }
            }

            if (successCount > 0) {
                showStatus(`✅ Success! Sent to ${successCount} devices. (Failed: ${failCount})`, 'success');
            } else {
                showStatus(`❌ Failed to send. Check console.`, 'error');
            }

        } catch (err) {
            console.error(err);
            // DEBUG: Show popup on mobile so user knows WHY it failed
            alert(`❌ Error: ${err.message}`);
            showStatus(`❌ Error: ${err.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Notification';
        }
    }

    // Helper to generate ID if missing (with polyfill for older browsers)
    function getOrGenerateBrowserId() {
        let bid = localStorage.getItem('archazz_browser_id');
        if (!bid) {
            try {
                if (crypto && crypto.randomUUID) {
                    bid = crypto.randomUUID();
                } else {
                    // Polyfill
                    bid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        const r = Math.random() * 16 | 0;
                        const v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                }
                localStorage.setItem('archazz_browser_id', bid);
            } catch (e) {
                bid = 'fallback-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('archazz_browser_id', bid);
            }
        }
        return bid;
    }

    function showStatus(html, type) {
        const box = document.getElementById('status-box');
        box.innerHTML = html;
        box.className = `status ${type}`; // set class (success/error)
        box.style.display = 'block';
    }

    // Show My ID on load
    window.onload = function() {
        const myId = getOrGenerateBrowserId();
        const statsEl = document.getElementById('stats');
        // Clean existing text to append ID
        const currentText = statsEl.textContent; 
        statsEl.innerHTML = currentText + `<br><small style="opacity:0.7; font-size:0.8em">My ID: ${myId}</small>`;
    };
    
    async function checkDatabaseIds() {
        const box = document.getElementById('status-box');
        box.style.display = 'block';
        box.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting to Database...';
        box.className = 'status';

        try {
             const myId = getOrGenerateBrowserId();
             
             const { data, error } = await window.supabaseClient
                .from('fcm_tokens')
                .select('browser_id, last_active')
                .order('last_active', { ascending: false })
                .limit(10);

             if (error) throw error;
             
             if (!data || data.length === 0) {
                 showStatus('📭 Database Kosong! Belum ada subscriber.', 'error');
                 return;
             }
             
             let html = `<div style="text-align:left; font-size:0.9em">
                <strong>🆔 Your ID:</strong> <br><code style="background:#444; color:#fff; padding:2px 4px; border-radius:3px; font-family:monospace">${myId}</code><hr style="border-color:#ccc; margin:10px 0">
                <strong>🗄️ Recent Subscribers:</strong><br>`;
             
             let found = false;
             data.forEach(d => {
                 const isMe = d.browser_id === myId;
                 if (isMe) found = true;
                 html += `<div style="margin-bottom:8px; padding:5px; border-radius:4px; ${isMe ? 'background:#d1fae5; color:#065f46; border:1px solid #10b981' : 'background:#f3f4f6; border:1px solid #e5e7eb'}">
                    ${isMe ? '✅ <strong>YOU</strong>' : '👤 User'} <span style="font-family:monospace">${d.browser_id.slice(0,8)}...</span>
                    <br><small style="opacity:0.8">Active: ${new Date(d.last_active).toLocaleTimeString()}</small>
                 </div>`;
             });
             html += "</div>";
             
             if (!found) {
                 html += "<div style='margin-top:10px; color:#ef4444; font-weight:bold; text-align:center'>⚠️ ID NOT FOUND IN DB</div><div style='font-size:0.8em; text-align:center'>Try enabling notifications again on Home page.</div>";
                 showStatus(html, 'error');
             } else {
                 html += "<div style='margin-top:10px; color:#10b981; font-weight:bold; text-align:center'>✅ ID MATCHED! Ready.</div>";
                 showStatus(html, 'success');
             }
             
        } catch (e) {
            showStatus('Error Check DB: ' + e.message, 'error');
        }
    }
</script>

</body>
</html>
