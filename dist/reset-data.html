<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchazzBook - Reset Data</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #667EEA;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-outline {
            background: white;
            color: #667EEA;
            border: 2px solid #667EEA;
        }
        .success {
            background: #D1FAE5;
            color: #065F46;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Reset ArchazzBook Data</h1>
        <p>Klik tombol di bawah untuk menghapus semua data (buku, views, dll) dan mulai fresh dari 0.</p>
        <p><strong>Warning:</strong> Semua buku yang sudah diupload akan hilang!</p>
        
        <button class="btn" onclick="resetData()">Reset Semua Data</button>
        <a href="index.html" class="btn btn-outline">Kembali ke Home</a>
        
        <div class="success" id="success-msg">
            ✅ Data berhasil direset! Semua stats sekarang 0.
        </div>
    </div>

    <script>
        function resetData() {
            if (confirm('Yakin mau reset semua data? Semua buku akan hilang!')) {
                // Clear all localStorage data
                localStorage.removeItem('books');
                localStorage.removeItem('booksViews');
                localStorage.removeItem('currentUser');
                
                // Show success message
                document.getElementById('success-msg').style.display = 'block';
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        }
    </script>
</body>
</html>
